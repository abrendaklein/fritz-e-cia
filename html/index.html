<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Fritz &amp; Cia: Uma ONG dedicada a transformar a vida de animais de rua através de resgate, carinho e adoção responsável.">
    <title>Fritz &amp; Cia - Proteção Animal e Adoção Responsável</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <a class="pular" href="#app">Pular para o conteúdo</a>

    <header>
        <a href="#/">
            <img class="logo" src="../imagens/logo-fritz-cia.png" alt="Fritz &amp; Cia - página inicial" width="800" height="710">
        </a>
 
        <p>A nossa visita mais esperada.</p>
 
        <nav aria-label="Menu principal">
            <button class="menu-toggle" type="button" aria-label="Abrir menu" aria-expanded="false" aria-controls="menu-lista">
                ☰
            </button>
 
            <ul id="menu-lista">
                <li><a href="#/">Início</a></li>
                <li><a href="#/projetos">Projetos</a></li>
                <li><a href="#/cadastro">Cadastro</a></li>
            </ul>
        </nav>
    </header>
 
    <main id="app" tabindex="-1"></main>
 
    <footer>
        <p>Contato: <a href="mailto:contato@fritzecia.example">contato@fritzecia.example</a></p>
        <p>&copy; 2026 Fritz &amp; Cia. Projeto acadêmico fictício, inspirado em uma história real.</p>
    </footer>
 
    <!-- ===== TEMPLATE: INÍCIO ===== -->
    <template id="tpl-inicio">
        <section id="historia">
            <h1>A História do Fritz</h1>
 
            <figure>
                <img src="../imagens/fritz.png" alt="Ilustração do Fritz, gato laranja e branco, deitado de barriga pra cima com as patinhas levemente levantadas e a língua de fora" width="900" height="430">
                <figcaption>Fritz em seu estado natural: de barriga pra cima, esperando o café.</figcaption>
            </figure>
 
            <h3>A Chegada</h3>
            <p>Fritz era um gatinho laranja de rua que vivia no nosso bairro. Nunca foi dono de ninguém e era amigo de todo mundo. Lembro bem da primeira vez que ele apareceu: magrinho, magrinho...</p>
 
            <h3>A Rotina</h3>
            <p>Ele costumava chegar na hora do café da tarde. Aos poucos, o nosso café foi ganhando um lugar pra ele, e o Fritz foi ganhando uma pancinha. Virou a visita mais esperada da semana.</p>
 
            <h3>A Lição</h3>
            <p>O Fritz nunca teve uma casa só dele, mas sempre tinha pra onde voltar. Foi com ele que aprendemos que todo gatinho merece um lugar onde chegar, nem que seja só pra tomar um cafezinho.</p>
        </section>
 
        <section id="missao">
            <h2>Nossa Missão</h2>
            <p>Resgatamos gatinhos, cuidamos deles até estarem prontos e ajudamos cada um a encontrar a sua casa, seja através da adoção ou recebendo gatinhos para doação.</p>
        </section>
 
        <section id="projetos">
            <h2>Nossos Projetos</h2>
 
            <article>
                <h3>Ronda do Fritz</h3>
                <p>Assim como o Fritz fazia a ronda pelo bairro, nossa equipe sai atrás de gatinhos que precisam de ajuda. Cada resgate começa com alguém avisando que viu um bichinho magrinho pela rua.</p>
            </article>
 
            <article>
                <h3>Cantinho do Café</h3>
                <p>Aqui os resgatados comem, tomam vacina, são castrados e ganham uma pancinha, igual ao Fritz. Ficam no Cantinho até estarem saudáveis e prontos pra ir pra casa.</p>
            </article>
 
            <article>
                <h3>Visita Definitiva</h3>
                <p>É quando a visita vira morador. Ajudamos as famílias a encontrar o gatinho certo e acompanhamos a adaptação. Você também pode cadastrar um gatinho para doação.</p>
            </article>
        </section>
 
        <section id="contato">
            <h2>Contato</h2>
            <address>
                <p>Telefone: <a href="tel:+5551985516743">(51) 98551-6743</a></p>
                <p>Porto Alegre, RS</p>
            </address>
        </section>
    </template>
 
    <!-- ===== TEMPLATE: PROJETOS ===== -->
    <template id="tpl-projetos">
        <div class="topo-pagina">
            <div>
                <h1>Nossos Projetos</h1>
                <p>Cada gatinho passa por três etapas até ganhar uma casa. Cada etapa é um projeto.</p>
            </div>
            <img class="gato-lateral" src="../imagens/fritzzz.png" alt="Ilustração do Fritz, gato laranja listrado de patas brancas, se espreguiçando com o rabo pra cima e os olhos fechados, sorrindo" width="700" height="963">
        </div>

        <div id="lista-projetos"></div>
 
        <section id="participe">
            <h2>Quer participar?</h2>
            <p>Seja voluntário, adote ou cadastre um gatinho para doação.</p>
            <p><a href="#/cadastro">Ir para o cadastro</a></p>
        </section>
    </template>
 
    <!-- ===== TEMPLATE: CADASTRO ===== -->
    <template id="tpl-cadastro">
        <h1>Cadastro</h1>
        <p>Quer ajudar, adotar ou doar um gatinho? Preencha os dados abaixo. Campos com * são obrigatórios.</p>
 
        <div class="cadastro-layout">
 
            <form id="form-cadastro" action="#" method="post">
 
                <fieldset>
                    <legend>Como você quer participar?</legend>
 
                    <input type="radio" id="tipo-voluntario" name="tipo" value="voluntario" required>
                    <label for="tipo-voluntario">Ser voluntário</label>
 
                    <input type="radio" id="tipo-adotante" name="tipo" value="adotante">
                    <label for="tipo-adotante">Adotar um gatinho</label>
 
                    <input type="radio" id="tipo-doador" name="tipo" value="doador">
                    <label for="tipo-doador">Doar um gatinho</label>
                </fieldset>
 
                <fieldset>
                    <legend>Dados pessoais</legend>
 
                    <label for="nome">Nome completo *</label>
                    <input type="text" id="nome" name="nome" required minlength="5" maxlength="80" autocomplete="name">
 
                    <label for="email">E-mail *</label>
                    <input type="email" id="email" name="email" required autocomplete="email">
 
                    <label for="nascimento">Data de nascimento *</label>
                    <input type="date" id="nascimento" name="nascimento" required>
 
                    <label for="cpf">CPF *</label>
                    <input type="text" id="cpf" name="cpf" required inputmode="numeric" maxlength="14"
                           pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" placeholder="000.000.000-00"
                           title="Digite o CPF no formato 000.000.000-00">
 
                    <label for="telefone">Telefone *</label>
                    <input type="tel" id="telefone" name="telefone" required inputmode="numeric" maxlength="15"
                           pattern="\(\d{2}\) \d{4,5}-\d{4}" placeholder="(51) 90000-0000"
                           title="Digite o telefone no formato (51) 90000-0000" autocomplete="tel">
                </fieldset>
 
                <fieldset>
                    <legend>Endereço</legend>
 
                    <label for="cep">CEP *</label>
                    <input type="text" id="cep" name="cep" required inputmode="numeric" maxlength="9"
                           pattern="\d{5}-\d{3}" placeholder="00000-000"
                           title="Digite o CEP no formato 00000-000" autocomplete="postal-code">
 
                    <label for="cidade">Cidade *</label>
                    <input type="text" id="cidade" name="cidade" required autocomplete="address-level2">
 
                    <label for="estado">Estado *</label>
                    <select id="estado" name="estado" required>
                        <option value="">Selecione</option>
                        <option value="RS">Rio Grande do Sul</option>
                        <option value="SC">Santa Catarina</option>
                        <option value="PR">Paraná</option>
                        <option value="SP">São Paulo</option>
                        <option value="RJ">Rio de Janeiro</option>
                        <option value="OUTRO">Outro</option>
                    </select>
                </fieldset>
 
                <fieldset>
                    <legend>Mais sobre você</legend>
 
                    <label for="mensagem">Conte um pouco sobre você e seus gatinhos</label>
                    <textarea id="mensagem" name="mensagem" rows="5" maxlength="500"></textarea>
 
                    <input type="checkbox" id="termos" name="termos" required>
                    <label for="termos">Concordo em receber contato da Fritz &amp; Cia *</label>
                </fieldset>
 
                <button type="submit">Enviar cadastro</button>
                <button type="reset">Limpar</button>
 
                <p id="mensagem-envio" role="status" aria-live="polite"></p>
            </form>
 
            <img class="gato-lateral" src="../imagens/fritzz.png" alt="Ilustração do Fritz, gato laranja e branco sentado, olhando pra frente com os olhos arregalados e uma patinha levantada mostrando as almofadinhas rosas" width="900" height="657">
 
        </div>

        <section id="cadastros-salvos">
            <h2>Cadastros enviados neste navegador</h2>
            <ul id="lista-cadastros"></ul>
            <button type="button" id="limpar-cadastros">Apagar histórico</button>
        </section>

    </template>

    <template id="tpl-card-projeto">
        <article>
            <span class="badge"></span>
            <h2></h2>
            <p></p>
            <ul></ul>
        </article>
    </template>
 
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.13/dayjs.min.js"></script>

    <script type="module" src="../js/main.js"></script>
</body>
</html>
